seed: 3407
run_dir: /data2/wjb/Denoising_PM/ACES/runs/stage02_sampling_only_seed3407_full

sampling:
  modes: [valid, sn2n_xy, iso3d, empirical_block, ellipsoid]
  stage1_run_dir: /data2/wjb/Denoising_PM/ACES/runs/stage01_3p_repeat_pairability_seed3407
  # q_threshold=0.8：半径落在配对结构相似度 S≈0.88 处，保留各向异性(xy 半径2 > z 半径1)
  # 同时守住自监督"两视图共享结构"前提。阈值 0.6 会使 xy 半径达 5(S≈0.65)，偏移过大。
  q_threshold: 0.8
  region: foreground
  noise_source: repeat
  metric: Q

training:
  train_folder: /data2/wjb/Denoising_PM/Methods/FAST-main/reproduction/valid_comparison/experiments/valid_paper_3p_neuron/original_workflow_paper_params_repeat01_seed3407/data/train_repeat01_275z
  train_frame_num: 10000
  epochs: 100
  max_batches_per_epoch: -1
  eval_every_epochs: 5
  # patch 尺寸受显存约束（48GB 卡实测：64x256x256≈46GB 已近上限；96x224x224 及以上 OOM）。
  # 采用 64x128x128（峰值≈11.5GB），与 Stage2 pilot 一致，余量可容纳采样阶段的额外张量。
  z_patch: 64
  w_patch: 128
  h_patch: 128
  z_overlap: 0.1
  w_overlap: 0.1
  h_overlap: 0.1
  patch_num: -1
  batch_size: 1
  num_workers: 0
  lr: 0.0001
  base_features: 16
  n_groups: 4
  weight_reg: 0.0001
  clip_gradients: 100.0

evaluation:
  mean9_proxy: /data2/wjb/Denoising_PM/Methods/FAST-main/reproduction/valid_comparison/experiments/valid_paper_3p_neuron/original_workflow_paper_params_repeat01_seed3407/data/gt_proxy/3P_neuron_mean9_gt_proxy_275z.tif
  patch_count: 18
  foreground_percentile: 75.0
