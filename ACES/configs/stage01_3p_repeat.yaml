  max_distance: 8
  depth_bins: 5
  foreground_percentile: 75.0
  max_samples_per_stat: 100000
  proxy_sigma: 0.8
  structure_sigma: 0.8
  gate_xy_z_ratio: 1.2
  gate_metric: Q
